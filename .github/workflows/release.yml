name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted
# publishing: GitHub proves its identity to npm, so no token is stored.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      # Build first: npm reads the "bin" entry before prepublishOnly runs,
      # and drops it from the package if dist/cli.js doesn't exist yet.
      - run: npm run build
      - run: npm publish --access public
